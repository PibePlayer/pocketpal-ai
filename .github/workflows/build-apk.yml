name: Build Android APK

# Allows manually triggering an APK build from the GitHub Actions UI
# or automatically on pushes to main / pull requests targeting main.
on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build type (debug or release)"
        required: true
        default: "release"
        type: choice
        options:
          - release
          - debug
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write  # needed to upload release assets

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Set up Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22.21.0'
          cache: 'yarn'

      # Step 3: Cache node_modules
      - name: Cache node_modules
        uses: actions/cache@v3
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('yarn.lock') }}

      # Step 4: Install Yarn and dependencies
      - name: Install Yarn
        run: npm install -g yarn

      - name: Install dependencies
        run: yarn install

      # Step 5: Set up JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      # Step 6: Create dummy google-services.json for CI
      - name: Create dummy google-services.json for CI
        run: |
          cat > android/app/google-services.json << 'EOL'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "dummy-project-for-ci",
              "storage_bucket": "dummy-project-for-ci.appspot.com"
            },
            "client": [{
              "client_info": {
                "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                "android_client_info": {
                  "package_name": "com.pocketpalai"
                }
              },
              "api_key": [{
                "current_key": "dummy-api-key-for-ci-builds"
              }]
            }]
          }
          EOL

      # Step 7: Create dummy .env file for CI
      - name: Create dummy .env file for CI
        run: |
          cat > .env << 'EOL'
          FIREBASE_FUNCTIONS_URL=https://dummy-firebase-url.com

          # PalsHub/Supabase Configuration
          SUPABASE_URL=https://dummy-supabase-url.supabase.co
          SUPABASE_ANON_KEY=dummy-anon-key-for-ci-builds
          PALSHUB_API_BASE_URL=https://dummy-palshub-api.com

          # App Configuration
          APP_URL=pocketpal://app

          # Feature Flags (true/false)
          ENABLE_PALSHUB_INTEGRATION=true
          ENABLE_AUTHENTICATION=true
          ENABLE_OFFLINE_MODE=true

          # Google Sign-In Configuration
          GOOGLE_IOS_CLIENT_ID=dummy-ios-client-id.apps.googleusercontent.com
          GOOGLE_WEB_CLIENT_ID=dummy-web-client-id.apps.googleusercontent.com
          EOL

      # Step 8: Create keystore (use real secrets if available, otherwise generate dummy)
      - name: Set up Android Keystore
        working-directory: android/app
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > pocketpal-release-key.keystore
            echo "KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
            echo "KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}" >> $GITHUB_ENV
          else
            keytool -genkeypair -v \
              -storetype PKCS12 \
              -keystore pocketpal-release-key.keystore \
              -alias pocketpal_key_alias \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass dummy-ci-password \
              -keypass dummy-ci-password \
              -dname "CN=CI Build, OU=CI, O=PocketPal, L=CI, S=CI, C=US"
            echo "KEYSTORE_PASSWORD=dummy-ci-password" >> $GITHUB_ENV
            echo "KEY_ALIAS=pocketpal_key_alias" >> $GITHUB_ENV
            echo "KEY_PASSWORD=dummy-ci-password" >> $GITHUB_ENV
          fi

      # Step 9: Build APK
      - name: Build Android ${{ github.event.inputs.build_type || 'release' }} APK
        working-directory: android
        env:
          APP_RELEASE_STORE_PASSWORD: ${{ env.KEYSTORE_PASSWORD }}
          APP_RELEASE_KEY_PASSWORD: ${{ env.KEY_PASSWORD }}
          GRADLE_USER_HOME: ${{ runner.temp }}/.gradle
        run: |
          if [ "${{ github.event.inputs.build_type }}" = "debug" ]; then
            ./gradlew assembleDebug
          else
            ./gradlew assembleRelease
          fi

      # Step 10: Determine APK path
      - name: Determine APK path
        id: apk_path
        run: |
          if [ "${{ github.event.inputs.build_type }}" = "debug" ]; then
            echo "apk_path=android/app/build/outputs/apk/debug/app-debug.apk" >> $GITHUB_OUTPUT
            echo "apk_name=pocketpal-debug.apk" >> $GITHUB_OUTPUT
          else
            echo "apk_path=android/app/build/outputs/apk/release/app-release.apk" >> $GITHUB_OUTPUT
            echo "apk_name=pocketpal-release.apk" >> $GITHUB_OUTPUT
          fi

      # Step 11: Upload APK as artifact (always available for download)
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk_path.outputs.apk_name }}
          path: ${{ steps.apk_path.outputs.apk_path }}
          retention-days: 30

      # Step 12: Create GitHub Release with APK (only on workflow_dispatch)
      - name: Get short SHA
        if: github.event_name == 'workflow_dispatch'
        id: short_sha
        run: echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Create GitHub Release with APK
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ steps.apk_path.outputs.apk_path }}
          tag_name: "apk-build-${{ steps.short_sha.outputs.sha }}"
          name: "APK Build (${{ github.event.inputs.build_type || 'release' }}) - ${{ steps.short_sha.outputs.sha }}"
          draft: false
          prerelease: true
          body: |
            ## Android APK Build

            **Build type:** ${{ github.event.inputs.build_type || 'release' }}
            **Commit:** ${{ github.sha }}
            **Branch:** ${{ github.ref_name }}

            ### What's included
            - Configurable GGUF download directory (Android)
            - In-place model loading from custom directory (no copy needed)
            - Storage Settings in the Settings screen

            ### Installation
            1. Download the APK file below
            2. Enable "Install from unknown sources" in Android settings
            3. Open the APK to install
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
